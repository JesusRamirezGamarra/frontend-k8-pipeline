apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-web-front-jesusramirez
  labels:
    app: mi-web-front-jesusramirez
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-web-front-jesusramirez
  template:
    metadata:
      labels:
        app: mi-web-front-jesusramirez
    spec:
      containers:
        - name: mi-web-front-jesusramirez
          image: jesusramirezgamarra/frontend-react-k8:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mi-web-front-service-jesusramirez
spec:
  selector:
    app: mi-web-front-jesusramirez
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer